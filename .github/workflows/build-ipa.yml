# GitHub のクラウド上の Mac でアプリをビルドし、iPhone に入れるための .ipa ファイルを作る
name: iPhoneアプリをビルド

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 最新の Xcode を選ぶ（iOS 26 の機能を使うため）
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "使用する Xcode: $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: ビルド（署名なし。署名は Sideloadly が自分の Apple ID で行う）
        run: |
          xcodebuild \
            -project PhotoSqueeze.xcodeproj \
            -target PhotoSqueeze \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: .ipa にまとめる
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/PhotoSqueeze.app Payload/
          zip -qry PhotoSqueeze.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSqueeze-ipa
          path: PhotoSqueeze.ipa
          retention-days: 30
