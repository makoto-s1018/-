# GitHub のクラウド上の Mac でアプリをビルドし、iPhone に入れるための .ipa ファイルを作る
name: iPhoneアプリをビルド

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 最新の Xcode を選ぶ（iOS 26 の機能を使うため）
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "使用する Xcode: $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: ビルド（署名なし。署名は Sideloadly が自分の Apple ID で行う）
        run: |
          set -o pipefail
          xcodebuild \
            -project PhotoSqueeze.xcodeproj \
            -target PhotoSqueeze \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: エラー内容を表示（失敗したときだけ）
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -30 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: .ipa にまとめる
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/PhotoSqueeze.app Payload/
          # アプリ本体が入っていない（プログラムのファイルが足りない）場合は失敗にする
          if [ ! -f Payload/PhotoSqueeze.app/PhotoSqueeze ]; then
            echo "::error::アプリ本体がありません。GitHub の PhotoSqueeze フォルダーに .swift ファイルがそろっているか確認してください"
            exit 1
          fi
          zip -qry PhotoSqueeze.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSqueeze-ipa
          path: PhotoSqueeze.ipa
          retention-days: 30
