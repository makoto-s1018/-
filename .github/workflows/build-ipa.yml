name: iPhoneアプリをビルド

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode のバージョン
        run: xcodebuild -version

      - name: ビルド
        run: |
          xcodebuild \
            -project PhotoSqueeze.xcodeproj \
            -target PhotoSqueeze \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: .ipa にまとめる
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/PhotoSqueeze.app Payload/
          zip -qry PhotoSqueeze.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSqueeze-ipa
          path: PhotoSqueeze.ipa
          retention-days: 30
